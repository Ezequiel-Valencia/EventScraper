[project]
name = "calendar_event_engine"
version = "0.4.0"
description = ""
authors = [{ name = "Ezequiel Valencia" }]
requires-python = ">=3.11,<4"
readme = "README.md"
dependencies = [
    "gql==4.4.0",
    "graphql-core>=3.3.2,<4",
    "pydantic>=2.14.3,<3",
    "tenacity>=9.2.1,<10",
    "google-auth[requests]>=2.62.2",
    "google-api-python-client>=2.202.0,<3",
    "google-auth-oauthlib>=1.5.0,<2",
    "geopy>=2.5.0,<3",
    "slack_sdk>=3.46.0,<4",
    "icalendar>=7.3.0,<8",
    "validators>=0.36.0,<0.37",
    "httpx2>=2.16.0,<3"
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pre-commit>=4.7.0",
    "deptry>=0.25.1",
    "mypy>=2.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "testcontainers>=4.15.0"
]

[tool.mypy]
files = ["calendar_event_engine"]

[[tool.mypy.overrides]]
module = [
    "geopy.*",
    "icalendar.*",
    "icalendar.cal",
    "google_auth_oauthlib.*",
    "googleapiclient.*",
    "google.auth.*",
    "google.oauth2.*",
]
ignore_missing_imports = true

[tool.deptry.per_rule_ignores]
# conftest.py is test-only, so pytest is correctly a dev dependency.
DEP004 = ["pytest"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that hit live external services (deselect with --mock-only)",
    "entire_system: full stack tests that run Mobilizon in docker via testcontainers (deselect with -m 'not entire_system' or --mock-only)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
# Pin the rule set so upgrading ruff doesn't silently change what is enforced.
select = ["E4", "E7", "E9", "F"]
